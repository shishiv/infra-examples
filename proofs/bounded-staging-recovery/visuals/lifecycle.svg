<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" aria-labelledby="bounded-staging-lifecycle-title bounded-staging-lifecycle-desc">
  <title id="bounded-staging-lifecycle-title">Ciclo de vida de uma janela de staging</title>
  <desc id="bounded-staging-lifecycle-desc">Máquina de estados mostrando staging pausado, validação sem mutação, execução com TTL e recuperação do estado anterior após falha, interrupção ou expiração.</desc>
  <defs>
    <marker id="bounded-staging-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#4b5563"/>
    </marker>
    <marker id="bounded-staging-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#1f2937"/>
    </marker>
    <style>
      .label { fill: #4b5563; font: 600 12px system-ui, sans-serif; letter-spacing: 0.08em; }
      .name { fill: #1f2937; font: 700 20px system-ui, sans-serif; }
      .detail { fill: #4b5563; font: 16px system-ui, sans-serif; }
      .tag { fill: #4b5563; font: 600 12px system-ui, sans-serif; letter-spacing: 0.12em; }
      .transition { fill: #374151; font: 600 12px system-ui, sans-serif; letter-spacing: 0.06em; }
      .note { fill: #374151; font: 16px system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Palette derives from the public paused-page artifact: #f5f5f5, #333 and #ffd43b. -->
  <rect width="800" height="640" fill="#f5f5f5"/>

  <!-- Connectors are behind state boxes. -->
  <path d="M208 248 H280" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#bounded-staging-arrow)"/>
  <path d="M456 248 H528" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#bounded-staging-arrow)"/>
  <path d="M656 200 V96 Q656 88 648 88 H136 Q128 88 128 96 V200" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#bounded-staging-arrow)"/>
  <path d="M576 296 V432" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#bounded-staging-arrow)"/>
  <path d="M656 432 V296" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#bounded-staging-arrow-accent)"/>
  <path d="M528 488 H88 Q80 488 80 480 V320 Q80 312 88 312 H128 V296" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#bounded-staging-arrow)"/>

  <!-- Arrow labels keep a visible gap from each connector. -->
  <rect x="216" y="216" width="56" height="16" rx="4" fill="#f5f5f5"/>
  <text x="244" y="228" text-anchor="middle" class="transition">INICIAR</text>

  <rect x="464" y="216" width="56" height="16" rx="4" fill="#f5f5f5"/>
  <text x="492" y="228" text-anchor="middle" class="transition">SMOKE</text>

  <rect x="312" y="48" width="160" height="16" rx="4" fill="#f5f5f5"/>
  <text x="392" y="60" text-anchor="middle" class="transition">TTL EXPIRA</text>

  <rect x="432" y="344" width="112" height="16" rx="4" fill="#f5f5f5"/>
  <text x="488" y="356" text-anchor="middle" class="transition">FALHA</text>

  <rect x="672" y="344" width="96" height="16" rx="4" fill="#f5f5f5"/>
  <text x="720" y="356" text-anchor="middle" class="transition">RESTAURAR</text>

  <rect x="224" y="504" width="184" height="16" rx="4" fill="#f5f5f5"/>
  <text x="316" y="516" text-anchor="middle" class="transition">PAUSADO/EXP.</text>

  <!-- Paused state -->
  <rect x="48" y="200" width="160" height="96" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <rect x="64" y="216" width="72" height="16" rx="4" fill="#f5f5f5" stroke="#4b5563" stroke-width="1"/>
  <text x="100" y="228" text-anchor="middle" class="tag">STATE</text>
  <text x="128" y="260" text-anchor="middle" class="name">Pausado</text>
  <text x="128" y="284" text-anchor="middle" class="detail">apps: 0 · página: 1</text>

  <!-- Validation gate -->
  <rect x="280" y="200" width="176" height="96" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <rect x="296" y="216" width="56" height="16" rx="4" fill="#f5f5f5" stroke="#4b5563" stroke-width="1"/>
  <text x="324" y="228" text-anchor="middle" class="tag">GATE</text>
  <text x="368" y="260" text-anchor="middle" class="name">Validar rota</text>
  <text x="368" y="284" text-anchor="middle" class="detail">manifesto + preflight</text>
  <text x="368" y="336" text-anchor="middle" class="note">Falha mantém Pausado.</text>

  <!-- Active state -->
  <rect x="528" y="200" width="176" height="96" rx="8" fill="#fff7d6" stroke="#8a6500" stroke-width="2"/>
  <rect x="544" y="216" width="72" height="16" rx="4" fill="#ffd43b" stroke="#8a6500" stroke-width="1"/>
  <text x="580" y="228" text-anchor="middle" class="tag">STATE</text>
  <text x="616" y="260" text-anchor="middle" class="name">Ativo com TTL</text>
  <text x="616" y="284" text-anchor="middle" class="detail">apps: 1 · TTL salvo</text>

  <!-- Recovery state -->
  <rect x="528" y="432" width="176" height="112" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="544" y="448" width="96" height="16" rx="4" fill="#f5f5f5" stroke="#4b5563" stroke-width="1"/>
  <text x="592" y="460" text-anchor="middle" class="tag">RECOVERY</text>
  <text x="616" y="492" text-anchor="middle" class="name">Restaurar estado</text>
  <text x="616" y="516" text-anchor="middle" class="detail">ciclo anterior + TTL</text>

  <line x1="48" y1="568" x2="752" y2="568" stroke="#9ca3af" stroke-width="1"/>
  <text x="48" y="592" class="label">NOTA DE LEITURA</text>
  <text x="200" y="592" class="note">Validação não cria estado.</text>
  <text x="200" y="616" class="note">A recuperação preserva o estado anterior quando possível.</text>
</svg>
