# Build and publish only the paused-page image owned by the Swarm example.
# Move this file to the repository root at .github/workflows/ to activate it.
# Application images remain outside this workflow.

name: Publish paused-page image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docker-swarm/staging/paused-html/**"
      - "github-actions/workflows/publish-paused-html.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-paused-page
  cancel-in-progress: false

jobs:
  publish:
    name: Publish immutable paused-page image
    runs-on: ubuntu-latest
    env:
      REGISTRY_HOST: ghcr.io
      REGISTRY_NAMESPACE: ${{ github.repository_owner }}
      REGISTRY_USERNAME: ${{ github.actor }}
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/paused-page-example

    steps:
      - name: Checkout infrastructure contract
        uses: actions/checkout@v4

      - name: Build and push the immutable SHA tag
        id: publish
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${IMAGE_REPO}:sha-${GITHUB_SHA}"
          printf '%s' "${REGISTRY_TOKEN}" | docker login "${REGISTRY_HOST}" -u "${REGISTRY_USERNAME}" --password-stdin
          docker build -t "${tag}" docker-swarm/staging/paused-html
          docker push "${tag}"
          digest_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "${tag}")
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "digest_ref=${digest_ref}" >> "${GITHUB_OUTPUT}"

      - name: Verify both references satisfy the manifest contract
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.publish.outputs.tag }}
          IMAGE_DIGEST_REF: ${{ steps.publish.outputs.digest_ref }}
        run: |
          set -euo pipefail
          for reference in "${IMAGE_TAG}" "${IMAGE_DIGEST_REF}"; do
            sh -c 'cd docker-swarm/staging/scripts && . ./lib.sh && validate_immutable_image "$1"' _ "${reference}" \
              || { echo "Not an immutable manifest reference: ${reference}" >&2; exit 1; }
          done
          {
            echo "### paused-page published"
            echo ""
            echo '```yaml'
            echo "images:"
            echo "  paused-html: \"${IMAGE_DIGEST_REF}\""
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove container registry credentials
        if: always()
        shell: bash
        run: docker logout "${REGISTRY_HOST}" || true
