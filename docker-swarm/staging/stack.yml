# Generic Docker Swarm stack template: staging
#
# Rendered and deployed by staging/scripts/start.sh. Every service image,
# host, edge value, and certificate resolver is injected from validated
# configuration or an immutable manifest before deployment.
#
# The paused-html service is always deployed.  When staging is active
# the application services run normally; when staging is stopped the
# edge router switches to the paused-html service so the configured web host
# returns an explicit "paused" response instead of a generic error.
#
# The template is scoped to stack "staging" by default. It does not define a
# second environment or any target-specific endpoint.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck: &default-healthcheck
  interval: 15s
  timeout: 5s
  retries: 4
  start_period: 30s

services:
  # ── Paused-state placeholder ──────────────────────────────────────
  paused-html:
    image: ""
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
    networks:
      - __STACK_NAME__-net
      - __EDGE_NETWORK__
    logging: *default-logging
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
        reservations:
          cpus: "0.025"
          memory: 16M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=__EDGE_NETWORK__"
        - "traefik.http.routers.__STACK_NAME__-paused.rule=Host(`__PUBLIC_WEB_HOST__`)"
        - "traefik.http.routers.__STACK_NAME__-paused.entrypoints=websecure"
        - "traefik.http.routers.__STACK_NAME__-paused.tls.certresolver=__EDGE_CERT_RESOLVER__"
        - "traefik.http.routers.__STACK_NAME__-paused.priority=1"
        - "traefik.http.services.__STACK_NAME__-paused.loadbalancer.server.port=80"

  # ── Application services (scaled to 0 when paused) ──────────────
  sample-web:
    image: ""
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
    networks:
      - __STACK_NAME__-net
      - __EDGE_NETWORK__
    logging: *default-logging
    deploy:
      mode: replicated
      replicas: 0
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=__EDGE_NETWORK__"
        - "traefik.http.routers.__STACK_NAME__-sample-web.rule=Host(`__PUBLIC_WEB_HOST__`) && PathPrefix(`/`)"
        - "traefik.http.routers.__STACK_NAME__-sample-web.entrypoints=websecure"
        - "traefik.http.routers.__STACK_NAME__-sample-web.tls.certresolver=__EDGE_CERT_RESOLVER__"
        - "traefik.http.routers.__STACK_NAME__-sample-web.priority=10"
        - "traefik.http.services.__STACK_NAME__-sample-web.loadbalancer.server.port=3000"

  sample-api:
    image: ""
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4000/health"]
    networks:
      - __STACK_NAME__-net
      - __EDGE_NETWORK__
    logging: *default-logging
    deploy:
      mode: replicated
      replicas: 0
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=__EDGE_NETWORK__"
        - "traefik.http.routers.__STACK_NAME__-sample-api.rule=Host(`__PUBLIC_API_HOST__`)"
        - "traefik.http.routers.__STACK_NAME__-sample-api.entrypoints=websecure"
        - "traefik.http.routers.__STACK_NAME__-sample-api.tls.certresolver=__EDGE_CERT_RESOLVER__"
        - "traefik.http.routers.__STACK_NAME__-sample-api.priority=10"
        - "traefik.http.services.__STACK_NAME__-sample-api.loadbalancer.server.port=4000"

  worker-sidecar:
    image: ""
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7000/health"]
    networks:
      - __STACK_NAME__-net
    logging: *default-logging
    deploy:
      mode: replicated
      replicas: 0
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  dashboard-web:
    image: ""
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5000/health"]
    networks:
      - __STACK_NAME__-net
      - __EDGE_NETWORK__
    logging: *default-logging
    deploy:
      mode: replicated
      replicas: 0
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=__EDGE_NETWORK__"
        - "traefik.http.routers.__STACK_NAME__-dashboard-web.rule=Host(`__PUBLIC_DASHBOARD_HOST__`)"
        - "traefik.http.routers.__STACK_NAME__-dashboard-web.entrypoints=websecure"
        - "traefik.http.routers.__STACK_NAME__-dashboard-web.tls.certresolver=__EDGE_CERT_RESOLVER__"
        - "traefik.http.routers.__STACK_NAME__-dashboard-web.priority=10"
        - "traefik.http.services.__STACK_NAME__-dashboard-web.loadbalancer.server.port=5000"

  sample-service:
    image: ""
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:6000/health"]
    networks:
      - __STACK_NAME__-net
      - __EDGE_NETWORK__
    logging: *default-logging
    deploy:
      mode: replicated
      replicas: 0
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=__EDGE_NETWORK__"
        - "traefik.http.routers.__STACK_NAME__-sample-service.rule=Host(`__PUBLIC_SERVICE_HOST__`)"
        - "traefik.http.routers.__STACK_NAME__-sample-service.entrypoints=websecure"
        - "traefik.http.routers.__STACK_NAME__-sample-service.tls.certresolver=__EDGE_CERT_RESOLVER__"
        - "traefik.http.routers.__STACK_NAME__-sample-service.priority=10"
        - "traefik.http.services.__STACK_NAME__-sample-service.loadbalancer.server.port=6000"

networks:
  __STACK_NAME__-net:
    driver: overlay
    attachable: true
  __EDGE_NETWORK__:
    external: true
    name: __EDGE_NETWORK__
